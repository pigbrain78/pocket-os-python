name: PocketOS canonical API health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check canonical health
        env:
          POCKETOS_HEALTH_ATTEMPTS: "3"
          POCKETOS_HEALTH_RETRY_DELAY: "10"
          POCKETOS_HEALTH_TIMEOUT: "30"
        run: |
          set -euo pipefail
          python scripts/monitor_render_api.py
